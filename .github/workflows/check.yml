name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Forbidden-pattern scan
        run: python3 scripts/scan.py
      - name: Markdown link check
        run: python3 scripts/linkcheck.py
      - name: Numbers in the README still compute
        run: python3 scripts/metrics.py
      - name: Guard hook self-test
        run: python3 hooks/guard.py --test
      - name: Shell scripts parse
        run: for f in scripts/*.sh bootstrap/*.sh; do bash -n "$f"; done
      - name: Dashboard tests
        run: |
          node --test dashboard/tests/logic.test.js dashboard/tests/seed.test.js
          python3 -m unittest discover -s dashboard/tests -p 'test_*.py'
      - name: Restore test in a temporary home
        run: bash bootstrap/restore_test.sh
